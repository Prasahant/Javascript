<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .body{
            background-color: black;
            color:white;

        }
    </style>
</head>
<body class="body">
    <ul class='language'>
        <li>JavaScript</li>
    </ul>



    <script>
        //first method
        function addLanguage(lan)  {
            const li = document.createElement('li');
            li.innerHTML = `${lan}`;
            document.querySelector('.language').appendChild(li);
        }
        addLanguage("python")
        addLanguage("java")


        //Second or Optimized way
        function addOptLanguage(lan)  {
            const li = document.createElement('li');
            li.appendChild(document.createTextNode(lan))
            document.querySelector('.language').appendChild(li);
        }
        addOptLanguage("ruby");



        //EDIT  value

        ///first option
        const secondLang = document.querySelector("li:nth-child(2)")
        secondLang.innerHTML = "SQL";


        //second option
        const thirdLang = document.querySelector("li:nth-child(3)");
        const newli = document.createElement('li');
        newli.textContent = "Mojo";
        thirdLang.replaceWith(newli)

        //third option
        const firstLang = document.querySelector("li:first-child");
        firstLang.outerHTML = '<li>MongoDB</li>'
        

        //REMOVE
        const lastLang = document.querySelector("li:last-child");
        lastLang.remove()
        

    </script>
</body>
</html>
