<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <h1>Chai Aur Code</h1>
    <button id="stop">Stop!</button>

    <script>
        function sayPrashant() {
            console.log("Hello Prashant");
        }

        function changetext() {
            document.querySelector("h1").innerHTML = "Hello Prashant";
        }
        const changeMe = setTimeout(changetext, 3000);

        document.getElementById("stop").addEventListener("click", function() {
            clearTimeout(changeMe);
            console.log("STOPPED");
        });

    </script>
</body>
</html>
