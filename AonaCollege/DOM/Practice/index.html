<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Dom</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <!--Create a H@ heading elements with text -"Hello JavaScript".
Append "From Apne College students" to this using js-->
    <h2>Hello JavaScript</h2>


    <!--Create 3 divs with common class name - "box". Access them & add some unique text to each-->
    <div class="class-name">box1</div>
    <div class="class-name">box2</div>
    <div class="class-name">box3</div>


    <div id="parent">
        <div class="box">
            <div class="inner-box">
                <p>Existing paragraph</p>
            </div>
        </div>

        <div class="box">
            <p>Another paragraph</p>
        </div>
    </div>

    <div id="box">
        <p id="para1">First Paragraph</p>
        <p id="para2">Second Paragraph</p>
    </div>


    <script src="script.js"></script>
</body>
